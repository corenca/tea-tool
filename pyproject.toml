[project]
name = "tea-tool"
version = "0.1.0"
description = "Python tool box"
readme = "README.md"
authors = [
    { name = "Corenca", email = "corenca.wang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars[pyarrow]>=1.44.1",
]


[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
